  const am = root.querySelector('#addm'); if(am) am.onclick = ()=>{
    if(!st.mn) return; st.members.push({n:st.mn, l:st.ml||LANES[0]}); st.mn=''; save(); };
  root.querySelectorAll('[data-delm]').forEach(b=>b.onclick=()=>{ st.members.splice(+b.dataset.delm,1); save(); });
}},

/* ---------- 9. JiCredit ---------- */
jicredit:{ title:'JiCredit', draw(root, st, save){
  if(!Array.isArray(st.payers)){ st.payers=[]; st.scr='types'; st.type=null; }
  const scr = st.scr||'types';
  const type = st.type ? JT.find(t=>t.k===st.type) : null;
  const banner = `<div class="demo">Demo. All figures shown are sample data. No live payments, no real customer records.</div>`;
  const back = (to,label) => `<button class="back" data-scr="${to}" style="margin-bottom:12px">‹ ${label}</button>`;

  /* 1 — the type grid */
  if(scr==='types'){
    root.innerHTML = banner + `
    <div class="note" style="margin:0 0 14px">You already collect money every month. JiCredit makes that money build you a loan.</div>
    <div class="jgrid">
      ${JT.map(t=>`<button class="jt ${st.type===t.k?'on':''}" data-type="${t.k}">
        <b>${t.n}</b><small>${t.who}</small></button>`).join('')}
    </div>
    ${st.payers.length?`<div class="btnrow"><button class="btn" data-scr="ledger">Open this month</button></div>`:''}`;
    root.querySelectorAll('[data-type]').forEach(b=>b.onclick=()=>{
      st.type=b.dataset.type; st.step=1; st.scr='setup';
      const t=JT.find(x=>x.k===st.type); st.biz=''; st.amt=t.amt; st.day='5'; st.cnt=Math.min(t.cnt,12); save(); });
    bindScr(root, st, save);
    return;
  }

  /* 2 — three setup steps */
  if(scr==='setup'){
    const step = st.step||1;
    const val = demoRail.validateAccount(st.acct||'');
    root.innerHTML = banner + back('types','Business type') + `
    <div class="steps">${[1,2,3].map(i=>`<span class="stp ${i<=step?'on':''}"></span>`).join('')}</div>
    ${step===1?`
      <div class="sect" style="margin-top:14px">Step 1 · Who you bill</div>
      <div class="frow"><label class="fl">Business name<input class="in" id="f_biz" value="${ESC(st.biz)}"></label></div>
      <div class="frow"><label class="fl">How many ${type.who.toLowerCase()}<input class="in" id="f_cnt" inputmode="numeric" value="${ESC(st.cnt)}"></label></div>
      <div class="btnrow"><button class="btn" data-step="2">Next</button></div>`
    : step===2?`
      <div class="sect" style="margin-top:14px">Step 2 · What they pay</div>
      <div class="frow">
        <label class="fl">Amount each<input class="in" id="f_amt" inputmode="decimal" value="${ESC(st.amt)}"></label>
        <label class="fl">Due day<input class="in" id="f_day" inputmode="numeric" value="${ESC(st.day)}"></label>
      </div>
      <div class="out"><div class="orow"><span>Expected every month</span><b class="big">${KS(N(st.amt)*N(st.cnt))}</b></div>
        <div class="note">Invoices raise themselves on the ${ESC(st.day)}th. No till number, no typing, no chasing on WhatsApp.</div></div>
      <div class="btnrow"><button class="btn ghost" data-step="1">Back</button><button class="btn" data-step="3">Next</button></div>`
    :`
      <div class="sect" style="margin-top:14px">Step 3 · Where it lands</div>
      <div class="frow"><label class="fl">Your settlement account<input class="in" id="f_acct" inputmode="numeric" placeholder="Bank account number" value="${ESC(st.acct)}"></label></div>
      <div class="out" style="border-color:${val.ok?'rgba(231,178,75,.3)':'var(--line)'}">
        <div class="orow"><span>Account check</span><b>${val.ok?'Valid':'Not yet'}</b></div>
        <div class="note">Money moves payer account to biller account, directly. JiCredit never holds, pools or touches client funds.</div>
      </div>
      <div class="btnrow"><button class="btn ghost" data-step="2">Back</button>
        <button class="btn" id="build" ${val.ok?'':'disabled'}>Build the ledger</button></div>`}`;
    bindVals(root, st, save, ['biz','cnt','amt','day','acct']);
    root.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>{ st.step=+b.dataset.step; save(); });
    const bd=root.querySelector('#build'); if(bd) bd.onclick=()=>{
      const n=Math.max(1,Math.min(24,N(st.cnt)));
      st.payers = Array.from({length:n},(_,i)=>{
        const r=Math.random();
        const state = r<0.62?'paid':(r<0.8?'short':'silent');
        return {n:JNAMES[i%JNAMES.length], p:'07'+String(10000000+Math.floor(Math.random()*8999999)),
          due:N(st.amt), got: state==='paid'?N(st.amt):(state==='short'?Math.round(N(st.amt)*0.4):0), s:state};
      });
      st.hist = Array.from({length:6},()=>Math.round(62+Math.random()*33));
      st.scr='ledger'; save();
    };
    bindScr(root, st, save);
    return;
  }

  /* 3 — the monthly ledger: paid, short, silent */
  if(scr==='ledger'){
    const due = st.payers.reduce((s,p)=>s+p.due,0);
    const got = st.payers.reduce((s,p)=>s+p.got,0);
    const cnt = k => st.payers.filter(p=>p.s===k).length;
    const rate = due? got/due*100 : 0;
    root.innerHTML = banner + back('types', type?type.n:'Business type') + `
    <div class="out">
      <div class="orow"><span>${ESC(st.biz||(type?type.n:''))} · due this month</span><b>${KS(due)}</b></div>
      <div class="orow"><span>Collected</span><b class="big">${KS(got)}</b></div>
      <div class="bar" style="margin-top:8px"><i style="width:${Math.round(rate)}%"></i></div>
      <div class="note">${Math.round(rate)}% collected · ${cnt('paid')} paid · ${cnt('short')} short · ${cnt('silent')} silent</div>
    </div>
    <div class="tabs" style="margin-top:14px">
      ${[['ledger','Ledger'],['payer','Payer view'],['credit','Credit file'],['rail','Bank rail']].map(([k,l])=>
        `<button class="tab ${k==='ledger'?'on':''}" data-scr="${k}" style="font-size:11px">${l}</button>`).join('')}
    </div>
    <div class="list" style="margin-top:12px">
      ${st.payers.map((p,i)=>`<div class="li">
        <span>${ESC(p.n)}<br><small class="st-${p.s}">${p.s} · ${KS(p.got)} of ${KS(p.due)}</small></span>
        <span>${p.s==='paid'?'<b style="color:var(--gold)">✓</b>':`<button class="x mark" data-pay="${i}">Collect</button>`}
          <button class="x" data-msg="${i}">↗</button></span></div>`).join('')}
    </div>
    <div class="btnrow">
      <button class="btn ghost" id="csv">CSV</button>
      <button class="btn ghost" id="sheet">Spreadsheet</button>
      <button class="btn ghost" id="pdf">Lender statement</button>
    </div>`;
    root.querySelectorAll('[data-pay]').forEach(b=>b.onclick=()=>{
      const p=st.payers[+b.dataset.pay];
      const r=demoRail.requestCollection(p, p.due-p.got);
      if(r.ok){ p.got=p.due; p.s='paid'; p.ref=r.ref; }
      save();
    });
    root.querySelectorAll('[data-msg]').forEach(b=>b.onclick=()=>{ st.msgi=+b.dataset.msg; st.scr='msg'; save(); });
    root.querySelector('#csv').onclick = ()=> download('jicredit-'+Date.now()+'.csv',
      ['Name,Phone,Due,Collected,Status'].concat(st.payers.map(p=>[p.n,p.p,p.due,p.got,p.s].join(','))).join('\n'),'text/csv');
    root.querySelector('#sheet').onclick = ()=> download('jicredit-'+Date.now()+'.xls',
      '<table><tr><th>Name</th><th>Phone</th><th>Due</th><th>Collected</th><th>Status</th></tr>'+
      st.payers.map(p=>`<tr><td>${p.n}</td><td>${p.p}</td><td>${p.due}</td><td>${p.got}</td><td>${p.s}</td></tr>`).join('')+
      '</table>','application/vnd.ms-excel');
    root.querySelector('#pdf').onclick = ()=>{ st.scr='credit'; save(); };
    bindScr(root, st, save);
    return;
  }

  /* 3b — the WhatsApp message, shown before it sends */
  if(scr==='msg'){
    const p = st.payers[st.msgi||0];
    const text = `Habari ${p.n}.\n${st.biz||(type?type.n:'')} — ${KS(p.due-p.got)} is outstanding for this month.\nYou will get a request on your phone for the exact amount. Approve it and you are done.\nAsante.`;
    root.innerHTML = banner + back('ledger','Ledger') + `
    <div class="sect" style="margin-top:0">This is what they will see</div>
    <div class="msgbox">${ESC(text).replace(/\n/g,'<br>')}</div>
    <div class="btnrow"><button class="btn" id="send">Send on WhatsApp</button></div>
    <div class="note">Nothing is sent until you tap. The demo shows the message first on purpose — a collection message people did not expect is how billers lose payers.</div>`;
    root.querySelector('#send').onclick = ()=> wa(p.p, text);
    bindScr(root, st, save);
    return;
  }

  /* 4 — payer side */
  if(scr==='payer'){
    const bills = [
      {b:st.biz||(type?type.n:'Your biller'), a:N(st.amt), s:'due'},
      {b:'Ruiru Water', a:1500, s:'paid'},
      {b:'Mtaa Garbage', a:500, s:'paid'},
      {b:'Fibre — 20mbps', a:3000, s:'due'}
    ];
    root.innerHTML = banner + back('ledger','Ledger') + `
    <div class="note" style="margin:0 0 12px">One person, every bill they pay through JiCredit, in one list. This is the side that drags payers onto the rail.</div>
    <div class="list">${bills.map(x=>`<div class="li"><span>${ESC(x.b)}<br><small class="st-${x.s==='paid'?'paid':'silent'}">${x.s}</small></span>
      <b>${KS(x.a)}</b></div>`).join('')}</div>
    <div class="out"><div class="orow"><span>Owing right now</span><b class="big">${KS(bills.filter(x=>x.s==='due').reduce((s,x)=>s+x.a,0))}</b></div></div>`;
    bindScr(root, st, save);
    return;
  }

  /* 5 — credit file */
  if(scr==='credit'){
    const h = st.hist||[70,74,80,77,85,88];
    const avg = h.reduce((a,b)=>a+b,0)/h.length;
    const due = st.payers.reduce((s,p)=>s+p.due,0);
    root.innerHTML = banner + back('ledger','Ledger') + `
    <div class="out">
      <div class="orow"><span>Months on the rail</span><b>${h.length}</b></div>
      <div class="orow"><span>Average collection rate</span><b class="big">${Math.round(avg)}%</b></div>
      <div class="orow"><span>Verified monthly billing</span><b>${KS(due)}</b></div>
    </div>
    <div class="sect">Collection rate, month by month</div>
    <div class="hist">${h.map((v,i)=>`<div class="hb"><i style="height:${v}%"></i><small>m${i+1}</small></div>`).join('')}</div>
    <div class="note">Six months of bank-confirmed collections is the document missing from the SME loan files banks decline. It is not a statement the business wrote — it is a record the rail produced.</div>
    <div class="btnrow"><button class="btn" id="stmt">Lender statement</button></div>`;
    root.querySelector('#stmt').onclick = ()=>{
      const t=['JICREDIT — LENDER STATEMENT','Demo. Sample data. No live payments.','',
        'Biller: '+(st.biz||(type?type.n:'')), 'Type: '+(type?type.n:''), 'Date: '+today(),'',
        'Monthly billing,'+Math.round(due),'Payers,'+st.payers.length,
        'Average collection rate,'+Math.round(avg)+'%','','Month,Collection rate']
        .concat(h.map((v,i)=>`${i+1},${v}%`)).join('\n');
      download('jicredit-lender-statement.csv', t, 'text/csv');
    };
    bindScr(root, st, save);
    return;
  }

  /* 6 — the bank rail: the actual ask */
  root.innerHTML = banner + back('ledger','Ledger') + `
  <div class="note" style="margin:0 0 12px">Everything above runs on one adapter. Four endpoints is the whole ask.</div>
  <div class="list">
    ${[['Collection request','Push an exact amount to the payer\'s phone.'],
       ['Account validation','Confirm the biller\'s settlement account.'],
       ['Transaction callback','Notify when a payment lands.'],
       ['Direct debit mandate','Later. Approve once, stop chasing monthly.']]
      .map(([a,b],i)=>`<div class="li"><span><b>${i+1}. ${a}</b><br><small>${b}</small></span></div>`).join('')}
  </div>
  <div class="code">const demoRail = { requestCollection, validateAccount }</div>
  <div class="note">All bank contact goes through that block. Nothing else in the app touches a payment rail — swap the adapter, leave the rest alone. Credentials never ship in the bundle; they sit on the server that signs requests and receives callbacks.</div>
  <div class="out"><div class="note" style="margin:0">Standing answer to compliance: money moves payer account to biller account. JiCredit never holds, pools or touches client funds.</div></div>`;
  bindScr(root, st, save);
}},

/* ---------- 10. 10partners ---------- */
tenpartners:{ title:'Credit file', draw(root, st, save){
  const v = st.vals;
  const n = v.length;
  const mean = n? v.reduce((a,b)=>a+b,0)/n : 0;
  const sd = n? Math.sqrt(v.reduce((a,b)=>a+(b-mean)*(b-mean),0)/n) : 0;
  const cv = mean? sd/mean : 0;
  const low = n? Math.min(...v) : 0;
  const weak = n>=3 ? [...v].sort((a,b)=>a-b).slice(0,3).reduce((a,b)=>a+b,0)/3 : mean;
  const thin = v.filter(x=> mean && x < mean*0.4).length;
  let band='C', why='fewer than 6 months of record, or swings too wide to lend against';
  if(n>=6 && cv<0.25 && !thin){ band='A'; why='6+ months, month-to-month swing under 25%, no month below 40% of average'; }
  else if(n>=6 && cv<0.45){ band='B'; why='6+ months, swing under 45%'; }
  const cap = weak*0.2;
  root.innerHTML = `
  <div class="frow"><label class="fl">Business name<input class="in" id="f_biz" value="${ESC(st.biz)}"></label></div>
  <div class="frow">
    <label class="fl">Add a month's M-Pesa inflow<input class="in" id="f_v" inputmode="decimal" placeholder="e.g. 84000" value="${ESC(st.v)}"></label>
  </div>
  <div class="btnrow"><button class="btn" id="add">Add month</button>
    ${n?'<button class="btn ghost" id="clr">Clear</button>':''}</div>
  <div class="months">${v.map((x,i)=>`<button class="mo" data-del="${i}">${Math.round(x/1000)}k<small>m${i+1}</small></button>`).join('')
    || '<div class="none">Add 6 to 12 months from the statement. Nothing is uploaded — the numbers stay on this phone.</div>'}</div>
  ${n?`
  <div class="out">
    <div class="orow"><span>Months on record</span><b>${n}</b></div>
    <div class="orow"><span>Average month</span><b>${KS(mean)}</b></div>
    <div class="orow"><span>Weakest month</span><b>${KS(low)}</b></div>
    <div class="orow"><span>Month-to-month swing</span><b>${Math.round(cv*100)}%</b></div>
    <div class="orow" style="border-top:1px solid var(--line);margin-top:6px;padding-top:9px">
      <span>Band</span><b class="big">${band}</b></div>
    <div class="note">Band ${band}: ${why}.</div>
  </div>
  <div class="out">
    <div class="orow"><span>Weakest quarter average</span><b>${KS(weak)}</b></div>
    <div class="orow"><span>Repayment at 20% of that</span><b class="big">${KS(cap)}</b></div>
    <div class="note">This is arithmetic on the numbers entered, not a lending decision. The lender sets the rule; this file just shows the working so both sides argue about the same figures.</div>
  </div>
  <div class="btnrow"><button class="btn" id="pack">Export the file</button>
    <button class="btn ghost" id="send">Send summary</button></div>`:''}`;
  bindVals(root, st, save, ['biz','v']);
  root.querySelector('#add').onclick = ()=>{ if(!N(st.v)) return; st.vals.push(N(st.v)); st.v=''; save(); };
  const cl=root.querySelector('#clr'); if(cl) cl.onclick=()=>{ st.vals=[]; save(); };
  root.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{ st.vals.splice(+b.dataset.del,1); save(); });
  const pk=root.querySelector('#pack'); if(pk) pk.onclick=()=>download('credit-file.csv',
    [`Credit file,${st.biz||'unnamed'},${today()}`,'','Month,Inflow']
      .concat(v.map((x,i)=>`${i+1},${Math.round(x)}`))
      .concat(['',`Months,${n}`,`Average,${Math.round(mean)}`,`Weakest month,${Math.round(low)}`,
        `Swing,${Math.round(cv*100)}%`,`Band,${band}`,`Weakest quarter average,${Math.round(weak)}`,
        `Repayment at 20%,${Math.round(cap)}`]).join('\n'),'text/csv');
  const sn=root.querySelector('#send'); if(sn) sn.onclick=()=>wa(DB.get('system').wa,
    `Credit file · ${st.biz||'business'}\n${n} months\nAverage ${KS(mean)}\nSwing ${Math.round(cv*100)}%\nBand ${band}\nRepayment at 20% of weakest quarter: ${KS(cap)}`);
}},

/* ---------- 6. System ---------- */
system:{ title:'Data and sharing', draw(root, st, save){
  const size = JSON.stringify(DB.d).length;
  const reg = DB.get('nyumbani');
  root.innerHTML = `
  <div class="out">
    <div class="orow"><span>Working apps</span><b>${Object.keys(MODULES).length-1}</b></div>
    <div class="orow"><span>App pages</span><b>${APPS.length}</b></div>
    <div class="orow"><span>Registry members</span><b>${reg.members.length}</b></div>
    <div class="orow"><span>Data held</span><b>${(size/1024).toFixed(1)} KB</b></div>
    <div class="note">Everything typed into these apps is stored on this device only. Nothing is sent anywhere unless you tap a send button.</div>
  </div>

  <div class="sect">Where signups go</div>
  <div class="frow"><label class="fl">Your WhatsApp number<input class="in" id="f_wa" inputmode="tel" value="${ESC(st.wa||'')}"></label></div>
  <div class="frow"><label class="fl">Form endpoint (optional)<input class="in" id="f_endpoint" placeholder="Formspree or Supabase URL" value="${ESC(st.endpoint||'')}"></label></div>
  <div class="note">With no endpoint, a signup stays on the person's phone and they send it to you on WhatsApp. Paste a Formspree or Supabase URL and each one is also posted there — which is what you want once this is on GitHub Pages and strangers are signing up.</div>

  <div class="sect">Put it online</div>
  <div class="note" style="margin:0">Rename this file index.html, push it to a repo, turn on GitHub Pages. That is the whole deployment — one file, no build step, no server. It also runs offline from a phone's downloads folder, so you can WhatsApp it to someone with no data and it still works. Everyone who opens it gets their own empty copy.</div>

  <div class="sect">Your data</div>
  <div class="btnrow"><button class="btn" id="exp">Export everything</button><button class="btn ghost" id="impb">Import</button></div>
  <div id="impwrap" style="display:none;margin-top:12px">
    <label class="fl">Paste an exported file's contents<textarea class="in" id="impt" rows="4"></textarea></label>
    <div class="btnrow"><button class="btn" id="impgo">Load it</button></div>
  </div>
  <div class="btnrow"><button class="btn ghost" id="wipe">Erase all app data</button></div>`;
  bindVals(root, st, save, ['wa','endpoint']);
  root.querySelector('#exp').onclick = ()=> download('alvin-os-data-'+Date.now()+'.json', JSON.stringify(DB.d,null,1), 'application/json');
  root.querySelector('#impb').onclick = ()=>{ const w=root.querySelector('#impwrap'); w.style.display = w.style.display==='none'?'block':'none'; };
  root.querySelector('#impgo').onclick = ()=>{
    try{ DB.d = JSON.parse(root.querySelector('#impt').value); save(); }
    catch(e){ alert('That did not read as an export file.'); }
  };
  root.querySelector('#wipe').onclick = ()=>{ DB.d={}; save(); };
}}
};

/* ============ state + render ============ */
const stage = document.getElementById('stage');
const dock  = document.getElementById('dock');
let stack = [{v:'home', page:0}];
let dir = 'push';

const byId = id => APPS.find(a=>a.id===id);
const pages = [
  {t:'Building now', f:a=>a.p===0},
  {t:'Portfolio',    f:a=>a.p===1},
  {t:'Field and tools', f:a=>a.p===2}
];

function tile(a, cls){
  return `<span class="tile ${cls||''}" style="background:linear-gradient(155deg,${a.c},${shade(a.c,-28)})">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">${G[a.g]}</svg></span>`;
}
function shade(hex,amt){
  const n=parseInt(hex.slice(1),16);
  let r=(n>>16)+amt, g=((n>>8)&255)+amt, b=(n&255)+amt;
  r=Math.max(0,Math.min(255,r));g=Math.max(0,Math.min(255,g));b=Math.max(0,Math.min(255,b));
  return '#'+((r<<16)|(g<<8)|b).toString(16).padStart(6,'0');
}
const chev = '<span class="chev"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 5 7 7-7 7"/></svg></span>';
const backBtn = (label) => `<button class="back" data-act="back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5 8 12l7 7"/></svg>${label}</button>`;

function render(){
  const s = stack[stack.length-1];
  let html = '';
  if(s.v==='home'){
    const list = APPS.filter(pages[s.page].f);
    html = `<div class="view ${dir}">
      <div class="scroll">
        <div class="searchbar" data-act="search">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.2-3.2"/></svg>
          Search ${APPS.length} apps
        </div>
        <div class="widget">
          <div class="row"><span class="n">${APPS.length}</span>
            <span class="lab">things built or specified<br>across the portfolio</span></div>
          <div class="sub">Nine of them run for real. Tap any icon and it opens working — About, at the top right, is where the thinking behind it lives.</div>
        </div>
        <div class="cta"><button data-run="nyumbani">Sign up at the Nyumbani Hub registry</button></div>
        <div class="pagehead">
          <div><h2>${pages[s.page].t}</h2><div class="count">${list.length} apps · page ${s.page+1} of ${pages.length}</div></div>
          <div class="arrows">
            <button data-act="prevpage" ${s.page===0?'disabled':''}>‹</button>
            <button data-act="nextpage" ${s.page===pages.length-1?'disabled':''}>›</button>
          </div>
        </div>
        <div class="grid">
          ${list.map(a=>`<button class="app" data-open="${a.id}">${tile(a)}<span class="nm">${a.n}</span></button>`).join('')}
        </div>
        <div class="dots">
          ${pages.map((p,i)=>`<button class="dot ${i===s.page?'on':''}" data-page="${i}" title="${p.t}"></button>`).join('')}
        </div>
      </div></div>`;
  }
  else if(s.v==='app'){
    const a = byId(s.id);
    const prev = stack[stack.length-2];
    const blab = (prev && prev.v==='run') ? 'Back' : 'Home';
    html = `<div class="view ${dir}">
      <div class="appbar">${backBtn(blab)}<span class="t">${a.n}</span></div>
      <div class="scroll">
        <div class="hero">${tile(a)}
          <div><h1>${a.n}</h1><p>${a.tag}</p>
          <span class="pill" style="color:${shade(a.c,70)}">${a.status}</span></div>
        </div>
        <div class="alias">Also called: ${a.alias}</div>
        ${MODULES[a.id]?`<div class="runrow"><button class="btn" data-run="${a.id}">Open ${MODULES[a.id].title}</button></div>`:''}
        <div class="cards">
          ${a.s.map((sec,i)=>`<button class="card" data-sec="${i}">
            <span><span class="ct">${sec.t}</span><span class="cs">${sec.d}</span></span>${chev}</button>`).join('')}
        </div>
      </div></div>`;
  }
  else if(s.v==='sec'){
    const a = byId(s.id), sec = a.s[s.i];
    html = `<div class="view ${dir}">
      <div class="appbar">${backBtn(a.n)}<span class="t">${sec.t}</span></div>
      <div class="scroll"><div class="detail">
        <h3>${sec.t}</h3><div class="of">${sec.d}</div>
        <ul>${sec.l.map(x=>`<li>${x}</li>`).join('')}</ul>
      </div></div></div>`;
  }
  else if(s.v==='run'){
    const a = byId(s.id);
    html = `<div class="view ${dir}">
      <div class="appbar">${backBtn('Home')}<span class="t">${a.n}</span><button class="ibtn" data-info="${a.id}">About</button></div>
      <div class="scroll"><div class="run" id="modroot"></div></div></div>`;
  }
  else if(s.v==='search'){
    const q = (s.q||'').trim().toLowerCase();
    const hits = q ? APPS.filter(a=>(a.n+' '+a.tag+' '+a.alias+' '+a.status).toLowerCase().includes(q)) : APPS;
    html = `<div class="view ${dir}">
      <div class="appbar">${backBtn('Back')}<span class="t">Search</span></div>
      <div class="searchwrap"><input id="q" placeholder="Name, status or what it does" value="${(s.q||'').replace(/"/g,'&quot;')}"></div>
      <div class="scroll">
        ${hits.length ? `<div class="results">${hits.map(a=>`<button class="res" data-open="${a.id}">${tile(a)}
            <span><span class="rn">${a.n}</span><span class="rs">${a.status} · ${a.tag}</span></span></button>`).join('')}</div>`
          : `<div class="empty">Nothing matches "${s.q}".<br>Try a status like paused, or a word from what it does.</div>`}
      </div></div>`;
  }
  stage.innerHTML = html;
  if(s.v==='run') drawMod(s.id);
  if(s.v==='search'){
    const q = document.getElementById('q');
    q.addEventListener('input', e=>{ s.q = e.target.value; const pos=e.target.selectionStart; dir=''; render(); const n=document.getElementById('q'); n.focus(); n.setSelectionRange(pos,pos); });
  }
  document.getElementById('navBack').disabled = stack.length<2;
  dir='push';
}

function drawMod(id){
  const root=document.getElementById('modroot'); if(!root) return;
  const a=document.activeElement, fid=(a&&a.id)?a.id:null;
  let pos=null; try{ pos=a&&a.selectionStart; }catch(e){}
  MODULES[id].draw(root, DB.get(id), ()=>{ DB.save(); drawMod(id); });
  if(fid){ const n=document.getElementById(fid);
    if(n){ n.focus(); if(pos!=null&&n.setSelectionRange){ try{ n.setSelectionRange(pos,pos); }catch(e){} } } }
}
function renderDock(){
  dock.innerHTML = APPS.filter(a=>a.dock).map(a=>
    `<button class="app" data-open="${a.id}">${tile(a)}<span class="nm">${a.n.split(' ')[0]}</span></button>`).join('');
}

function push(s){ dir='push'; stack.push(s); render(); }
function pop(){ if(stack.length>1){ dir='pop'; stack.pop(); render(); } }
function home(){ dir='pop'; stack=[{v:'home',page:stack[0].page||0}]; render(); }

document.body.addEventListener('click', e=>{
  const t = e.target.closest('[data-open],[data-act],[data-sec],[data-page],[data-run],[data-info]');
  if(!t) return;
  if(t.dataset.run){ push({v:'run', id:t.dataset.run}); return; }
  if(t.dataset.info){ push({v:'app', id:t.dataset.info}); return; }
  if(t.dataset.open){ const id=t.dataset.open;
    if(!byId(id)) return;
    push(MODULES[id]?{v:'run',id:id}:{v:'app',id:id}); return; }
  if(t.dataset.sec!==undefined && stack[stack.length-1].v==='app'){
    push({v:'sec', id:stack[stack.length-1].id, i:+t.dataset.sec}); return; }
  if(t.dataset.page!==undefined){ stack[0].page = +t.dataset.page; dir=''; render(); return; }
  const act = t.dataset.act;
  if(act==='back') pop();
  if(act==='search') push({v:'search', q:''});
  if(act==='nextpage'){ stack[0].page++; dir='push'; render(); }
  if(act==='prevpage'){ stack[0].page--; dir='pop'; render(); }
});
document.getElementById('navBack').onclick = pop;
document.getElementById('navHome').onclick = home;
document.getElementById('navSearch').onclick = ()=>{ if(stack[stack.length-1].v!=='search') push({v:'search',q:''}); };

/* swipe between home pages */
let x0=null;
stage.addEventListener('touchstart',e=>{x0=e.touches[0].clientX},{passive:true});
stage.addEventListener('touchend',e=>{
  if(x0===null) return; const dx=e.changedTouches[0].clientX-x0; x0=null;
  const s=stack[stack.length-1];
  if(Math.abs(dx)<60) return;
  if(s.v==='home'){
    if(dx<0 && s.page<pages.length-1){ s.page++; dir='push'; render(); }
    if(dx>0 && s.page>0){ s.page--; dir='pop'; render(); }
  } else if(dx>90){ pop(); }
},{passive:true});

/* clock */
function tick(){
  const t=new Date().toLocaleTimeString('en-GB',{timeZone:'Africa/Nairobi',hour:'2-digit',minute:'2-digit'});
  document.getElementById('clock').textContent=t;
}
tick(); setInterval(tick,20000);
DB.load().then(()=>{ renderDock(); render(); });
</script>
</body>
